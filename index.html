<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 가족 스마트 플래너</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div class="max-w-md mx-auto p-4 bg-white min-h-screen shadow-sm flex flex-col justify-between">
        <div>
            <!-- Header -->
            <div class="flex justify-between items-center mb-6 pt-2">
                <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    🏠 우리 가족 플래너
                </h1>
                <span id="sync-status" class="text-xs px-2.5 py-1 rounded-full font-medium bg-amber-100 text-amber-700">
                    연결 중...
                </span>
            </div>

            <!-- Date & Progress -->
            <div class="flex justify-between items-center mb-4 bg-blue-50 p-3 rounded-xl">
                <span id="current-date" class="text-sm font-semibold text-blue-900">날짜 불러오는 중...</span>
                <span id="progress-text" class="text-xs font-bold text-blue-700">0 / 0 완료</span>
            </div>

            <!-- Input Area -->
            <div class="flex gap-2 mb-6">
                <select id="todo-member" class="border border-gray-300 rounded-lg px-2 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="아빠">아빠</option>
                    <option value="엄마">엄마</option>
                    <option value="첫째">첫째</option>
                    <option value="둘째">둘째</option>
                    <option value="공통">공통</option>
                </select>
                <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" onkeypress="if(event.key === 'Enter') addTodo()">
                <button onclick="addTodo()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">추가</button>
            </div>

            <!-- Member Filter Tabs -->
            <div class="flex gap-1 mb-4 border-b border-gray-200 pb-2 overflow-x-auto">
                <button onclick="filterMember('전체')" class="filter-btn px-3 py-1 text-xs rounded-full bg-blue-600 text-white font-medium transition" data-member="전체">전체</button>
                <button onclick="filterMember('아빠')" class="filter-btn px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 font-medium transition" data-member="아빠">아빠</button>
                <button onclick="filterMember('엄마')" class="filter-btn px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 font-medium transition" data-member="엄마">엄마</button>
                <button onclick="filterMember('첫째')" class="filter-btn px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 font-medium transition" data-member="첫째">첫째</button>
                <button onclick="filterMember('둘째')" class="filter-btn px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 font-medium transition" data-member="둘째">둘째</button>
                <button onclick="filterMember('공통')" class="filter-btn px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 font-medium transition" data-member="공통">공통</button>
            </div>

            <!-- Todo List Container -->
            <div id="todo-list" class="space-y-2">
                <div class="text-center py-10 text-gray-400 text-sm">등록된 할 일이 없습니다.</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs text-gray-400 py-4">
            Family Smart Planner V1.0
        </div>
    </div>

    <script>
        // 🔴 아래 firebaseConfig 안의 내용을 본인의 설정값으로 정확히 채워주세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // App State
        let currentFilter = '전체';
        let allTodos = {};

        // Date Display
        const dateEl = document.getElementById('current-date');
        const today = new Date();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        dateEl.innerText = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')} (${days[today.getDay()]})`;

        // Realtime Sync Status & Data Fetching
        const statusEl = document.getElementById('sync-status');
        const todosRef = db.ref('todos');

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                statusEl.innerText = "● 실시간 동기화 중";
                statusEl.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-emerald-100 text-emerald-700";
            } else {
                statusEl.innerText = "○ 오프라인";
                statusEl.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-rose-100 text-rose-700";
            }
        });

        todosRef.on('value', (snapshot) => {
            allTodos = snapshot.val() || {};
            renderTodos();
        });

        // Add Todo
        function addTodo() {
            const input = document.getElementById('todo-input');
            const memberSelect = document.getElementById('todo-member');
            const text = input.value.trim();
            
            if (!text) return;

            const newTodoRef = todosRef.push();
            newTodoRef.set({
                text: text,
                member: memberSelect.value,
                completed: false,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
        }

        // Toggle Todo Status
        function toggleTodo(id) {
            const todo = allTodos[id];
            if (todo) {
                todosRef.child(id).update({ completed: !todo.completed });
            }
        }

        // Delete Todo
        function deleteTodo(id) {
            todosRef.child(id).remove();
        }

        // Filter Member
        function filterMember(member) {
            currentFilter = member;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.member === member) {
                    btn.className = "filter-btn px-3 py-1 text-xs rounded-full bg-blue-600 text-white font-medium transition";
                } else {
                    btn.className = "filter-btn px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 font-medium transition";
